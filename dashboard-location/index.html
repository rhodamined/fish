<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location Dashboard</title>
    <link rel="stylesheet" href="/dashboard-location/styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <section class="quadrant" data-location="the East River Esplanade">
        <div class="image-wrap"><img class="location-image" alt="The East River Esplanade" /></div>
        <div class="location-label">the East River Esplanade</div>
      </section>
      <section class="quadrant" data-location="Brooklyn Bridge Park">
        <div class="image-wrap"><img class="location-image" alt="Brooklyn Bridge Park" /></div>
        <div class="location-label">Brooklyn Bridge Park</div>
      </section>
      <section class="quadrant" data-location="the parking lot behind the Astoria Costco">
        <div class="image-wrap"><img class="location-image" alt="The parking lot behind the Astoria Costco" /></div>
        <div class="location-label">the parking lot behind the Astoria Costco</div>
      </section>
      <section class="quadrant" data-location="Queensbridge Park">
        <div class="image-wrap"><img class="location-image" alt="Queensbridge Park" /></div>
        <div class="location-label">Queensbridge Park</div>
      </section>
    </main>

    <script src="/dashboard-location/app.js"></script>
  </body>
</html>
