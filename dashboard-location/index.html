<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Location Dashboard</title>
    <link rel="stylesheet" href="/dashboard-location/styles.css" />
  </head>
  <body>
    <main class="dashboard">
      <section class="quadrant" data-fish="1" data-location="the East River Esplanade">
        <div class="image-wrap"><img class="location-image" alt="" /></div>
        <div class="location-label"></div>
      </section>
      <section class="quadrant" data-fish="2" data-location="Brooklyn Bridge Park">
        <div class="image-wrap"><img class="location-image" alt="" /></div>
        <div class="location-label"></div>
      </section>
      <section class="quadrant" data-fish="3" data-location="the parking lot behind the Astoria Costco">
        <div class="image-wrap"><img class="location-image" alt="" /></div>
        <div class="location-label"></div>
      </section>
      <section class="quadrant" data-fish="4" data-location="Queensbridge Park">
        <div class="image-wrap"><img class="location-image" alt="" /></div>
        <div class="location-label"></div>
      </section>
    </main>

    <script src="/dashboard-location/app.js"></script>
  </body>
</html>
